<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contacto</title>
</head>
<body>
   <main>
    <section>
        <h1>Formulario de contacto</h1>
        <form id="formularioContacto">
            <label for="nombreContacto">Nombre:</label>
            <input type="text" id="nombreContacto" required>
<br>
<br>
            <label for="correoContacto">Correo electrónico:</label>
            <input type="email" id="correoContacto" required>
<br>
<br>
            <label for="mensajeContacto">Mensaje:</label>
            <textarea id="mensajeContacto" rows="5" required></textarea>
<br>
<br>
            <button type="submit">Enviar mensaje</button>
        </form>
        <p id="respuestaContacto"></p>
    </section>
</main>
    <footer>
        <a href="index.html">Volver a index</a>
    </footer>
</body>
</html>
